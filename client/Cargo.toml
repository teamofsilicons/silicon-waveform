[package]
name="silicon-waveform-client"
version="0.1.0"
edition="2024"
rust-version="1.98"
description="Stateless Rust client for Silicon Waveform speech services"
repository="https://github.com/teamofsilicons/silicon-waveform"
documentation="https://docs.rs/silicon-waveform-client"
license-file="LICENSE"
readme="README.md"
[dependencies]
reqwest={version="0.13.4",default-features=false,features=["json","rustls"]}
serde={version="1.0",features=["derive"]}
serde_json="1.0"
thiserror="2.0"
url="2.5"
semver="1.0"
silicon-iam-client="1.3.0"
secrecy="0.10"
uuid={version="1",features=["v4"]}
tokio={version="1.53",features=["process","time"]}
[dev-dependencies]
wiremock="0.6"
tokio={version="1.53",features=["macros","rt-multi-thread"]}
