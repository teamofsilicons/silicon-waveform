[advisories]
unmaintained = "workspace"
yanked = "deny"
# Accounts client 0.4.0 enables jsonwebtoken's RustCrypto backend, which includes
# rsa 0.9.10. This application has no RSA private-key operations: Accounts JWT
# validation permits EdDSA only and Silicon assertions use ed25519-dalek.
# The advisory concerns private RSA signing/decryption timing. Re-audit whenever
# Accounts client/JWT algorithms change; see docs/security-advisories.md.
ignore = ["RUSTSEC-2023-0071"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Waveform is an unpublished internal service and intentionally uses the
# repository's `Proprietary` package marker rather than an SPDX distribution
# license. Dependencies still need an explicitly permitted license above.
[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
