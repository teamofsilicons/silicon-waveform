[package]
name = "silicon-waveform"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
publish = false
default-run = "waveform-api"

[lib]
name = "silicon_waveform"
path = "src/lib.rs"

[[bin]]
name = "waveform-api"
path = "src/bin/waveform_api.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "matched-path"] }
base64 = "0.22.1"
briefcase-client = "0.2.0"
percent-encoding = "2.3.2"
bytes = "1.11.0"
chacha20poly1305 = "0.10.1"
dotenvy = "0.15.7"
futures = "0.3.31"
hmac = "0.12.1"
http = "1.3.1"
mime = "0.3.17"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "http2",
  "json",
  "multipart",
  "query",
  "rustls",
  "stream",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
silicon-iam-client = "1.3.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-rustls-ring-native-roots",
  "uuid",
] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tower-http = { version = "0.7.0", features = ["sensitive-headers"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
