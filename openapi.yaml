openapi: 3.1.0
info:
  title: Silicon Waveform API
  version: 2.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: Provider-independent text-to-speech and speech-to-text
  description: |
    Synchronous speech operations for Carbons and Silicons, and for apps acting for them.

    **Authentication.** Every account route takes `Authorization: Bearer <access token>`, a Silicon
    Accounts access token issued to app `waveform` (EdDSA JWT; `aud` = `waveform`, `iss` = the Silicon
    Accounts URL). Carbons get one with `waveform login`; Silicons with
    `silicon-accounts login --app waveform -q | waveform login --slt-stdin`. Another app acting for an
    account sends `Authorization: Proof sap_…`, a User verification proof for `receiving_app` `waveform`,
    on the routes that list `proofAuth`. Waveform honours the scopes `waveform.tts` (`/tts`, `/audio/{request_id}`)
    and `waveform.stt` (`/stt`, `/stt/source-target`), from apps allowed for that scope by Waveform's
    operator (`WAVEFORM_PROOF_ISSUERS`), and acts as the proof's account.

    **Your account owns your data.** Everything belongs to the account that made the request. Account routes
    accept `?account=c:…|si:…|<uuid>`: a Carbon may select a Silicon it is the custodian of, to read its
    history and manage its settings, keys and Briefcase access. Nobody acts as another account.

    **Storage.** TTS output is normalized to MP3 and stored in the account's own Briefcase files with a User
    verification proof Waveform holds for the account. When Waveform cannot (Briefcase unavailable or
    refusing, no Briefcase access, or a call from another app), the request still completes: the MP3 is
    held by Waveform at `audio_url` until `storage.expires_at`, and `storage.reason` says why.

    This is contract 2.0.0 of API v1 (`X-Waveform-Contract-Version`).
servers:
  - url: https://backend.waveform.teamofsilicons.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Speech
    description: Text to speech, speech to text, and audio Waveform holds
  - name: Capabilities
    description: What this Waveform supports, independent of live provider health
  - name: Accounts
    description: Who is signed in, and the Silicons a Carbon is custodian of
  - name: Jobs
    description: The account's speech history
  - name: Settings
    description: Provider order, voice, telemetry and provider keys for an account
  - name: Briefcase access
    description: The proof Waveform holds to store and read the account's Briefcase files
  - name: Webhooks
    description: Events Silicon Accounts sends to Waveform

paths:
  /tts:
    post:
      security:
        - bearerAuth: []
        - proofAuth: []
      tags: [Speech]
      operationId: synthesizeSpeech
      summary: Convert text to speech
      description: |
        Runs the account's provider order (Gemini 3.1 Flash TTS Preview, ElevenLabs Multilingual v2, then
        OpenAI tts-1 by default; fallback is off unless `auto_fallback` is true), normalizes to MP3 and stores
        it in the account's Briefcase files (`storage.status` = `stored`, `file_url`). If Waveform cannot store
        it there, or another app called with a proof, the MP3 is held by Waveform (`storage.status` = `held`,
        `audio_url`, `storage.reason`). A completed idempotent retry re-checks access to the stored file and
        returns the same result without running a provider again. Proof scope: `waveform.tts`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TTSRequest' }
      responses:
        '200':
          description: Generated speech, stored in Briefcase or held by Waveform
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TTSResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }

  /stt:
    post:
      security:
        - bearerAuth: []
        - proofAuth: []
      tags: [Speech]
      operationId: transcribeSpeech
      summary: Transcribe a file in the account's Briefcase files
      description: |
        Reads the permanent Briefcase URL as the account (with Waveform's Briefcase proof for it), then runs
        the account's STT order (Gemini 3.5 Transcribe, gpt-transcribe, Deepgram Nova-3 by default, with
        automatic fallback). Waveform never fetches the supplied URL directly. A completed idempotent retry
        re-checks current access to the source before returning the cached transcript. An app calling with a
        proof (scope `waveform.stt`) can only use Briefcase access the account gave Waveform before; without
        it the answer is `403 storage_authorization_required`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/STTRequest' }
      responses:
        '200':
          description: Transcript, released after current source authorization
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/STTResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }

  /stt/source-target:
    post:
      security:
        - bearerAuth: []
        - proofAuth: []
      tags: [Speech]
      operationId: prepareTranscriptionSourceTarget
      summary: Get the account's Waveform folder in Briefcase for STT sources
      description: |
        Makes sure Waveform's folder (`apps/waveform`) exists in the account's Briefcase drive and returns it.
        Upload a source there with Briefcase, then transcribe its permanent URL. No speech provider runs.
        Briefcase shows Waveform its folder only through the files in it, so while the folder is still empty
        the answer is `404 briefcase_folder_not_found` (store one speech there first, or upload with your own
        Briefcase access). Proof scope: `waveform.stt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The account's Waveform folder
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [app_id, account, folder_id, folder_path]
                properties:
                  app_id: { type: string, const: waveform }
                  account: { $ref: '#/components/schemas/AccountRef' }
                  folder_id: { type: string, format: uuid }
                  folder_path: { type: string, example: apps/waveform }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }

  /audio/{request_id}:
    get:
      security:
        - bearerAuth: []
        - proofAuth: []
      tags: [Speech]
      operationId: getHeldAudio
      summary: Download an MP3 Waveform holds
      description: |
        Served only to the account that requested the speech (its own token, or an app's proof with
        `waveform.tts` acting for it) until it expires. Another account's request id answers 404, like an
        unknown or expired one.
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The MP3
          headers:
            X-Waveform-Audio-Expires-At: { schema: { type: string, format: date-time } }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }

  /capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: Get the stable Waveform-level speech capabilities
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Normalized service capabilities, independent of live provider health
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /accounts:
    get:
      tags: [Accounts]
      operationId: getAccountsDiscovery
      summary: Where to sign in to Waveform
      security: []
      responses:
        '200':
          description: Waveform's app id, the Silicon Accounts URL and the docs
          content:
            application/json:
              schema:
                type: object
                required: [app_id, accounts_url, api_url, docs_url, proof_scopes, version]
                properties:
                  app_id: { type: string, example: waveform }
                  accounts_url: { type: string, format: uri, example: https://accounts.teamofsilicons.com }
                  api_url: { type: string, format: uri }
                  docs_url: { type: string, format: uri }
                  proof_scopes: { type: array, items: { type: string }, example: [waveform.tts, waveform.stt] }
                  version: { type: string }
        '406': { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [Accounts]
      operationId: getMe
      summary: The signed-in account (also at /auth/me)
      responses:
        '200':
          description: The account the access token belongs to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      tags: [Accounts]
      operationId: getMeLegacyPath
      summary: The signed-in account (same as /me)
      responses:
        '200':
          description: The account the access token belongs to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /silicons:
    get:
      tags: [Accounts]
      operationId: listMySilicons
      summary: The Silicons the signed-in Carbon looks after (that Waveform knows)
      responses:
        '200':
          description: Silicons whose custodian is the caller; empty for a Silicon
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List the account's speech history (first 512 characters retained)
      parameters:
        - $ref: '#/components/parameters/Account'
        - in: query
          name: operation
          schema: { type: string, enum: [tts, stt] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          description: Opaque keyset cursor returned as next_cursor.
          schema: { type: string }
      responses:
        '200':
          description: Newest jobs first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }

  /jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get one of the account's speech jobs
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Speech job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }

  /preferences:
    get:
      tags: [Settings]
      operationId: getPreferences
      summary: Get the account's provider order, default voice and telemetry choice
      parameters:
        - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Effective account preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Settings]
      operationId: updatePreferences
      summary: Change the account's provider order, default voice or telemetry choice
      description: A custodian changing a Silicon's settings must have a live sign-in (checked with Silicon Accounts).
      parameters:
        - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesUpdate' }
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesUpdate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /voice-profiles:
    get:
      tags: [Settings]
      operationId: listVoiceProfiles
      summary: List voice profiles and their provider mappings
      responses:
        '200':
          description: Voice catalog; provisional mappings have auditioned=false
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VoiceProfile' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /provider-keys:
    get:
      tags: [Settings]
      operationId: listProviderKeys
      summary: List the account's saved provider keys without revealing them
      parameters:
        - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Configured providers
          content:
            application/json:
              schema:
                type: object
                required: [account, items]
                properties:
                  account: { $ref: '#/components/schemas/AccountRef' }
                  items: { type: array, items: { $ref: '#/components/schemas/ProviderKeyInfo' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /provider-keys/{provider}:
    put:
      tags: [Settings]
      operationId: setProviderKey
      summary: Save (replace) a provider key; it is never returned
      description: Needs a live sign-in (checked with Silicon Accounts).
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderKeyRequest' }
      responses:
        '204': { description: Provider key saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Settings]
      operationId: deleteProviderKey
      summary: Delete a saved provider key
      description: Needs a live sign-in (checked with Silicon Accounts).
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Account'
      responses:
        '204': { description: Provider key deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /storage-authorizations:
    post:
      tags: [Briefcase access]
      operationId: approveBriefcaseAccess
      summary: Give Waveform Briefcase access for this account (or replace it)
      description: |
        Waveform asks Silicon Accounts for a User verification proof for `receiving_app` `briefcase`
        (scopes `briefcase.uploads.reserve`, `briefcase.uploads.commit`, `briefcase.entries.list`,
        `briefcase.files.read`) from the caller's own access token, and keeps it encrypted. Only the account
        itself can do this; a custodian cannot approve for a Silicon. A direct speech request does the same
        when the account has no access yet, and replaces a proof that ended with the sign-in it was issued
        under once Briefcase refuses it; after the account or its custodian revoked the access (`DELETE`, or
        the account revoking the proof at Silicon Accounts), speech is held with `storage_not_authorized` until
        the account approves again here.
      responses:
        '201':
          description: Briefcase access is active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefcaseAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Briefcase access]
      operationId: getBriefcaseAccess
      summary: Status of Waveform's Briefcase access for the account
      parameters:
        - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: Status (`active`, `revoked` or `missing`); never a token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefcaseAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Briefcase access]
      operationId: revokeBriefcaseAccess
      summary: Revoke Waveform's Briefcase access for the account
      parameters:
        - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: The access is revoked at Silicon Accounts and its tokens are wiped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefcaseAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contracts:
    get:
      tags: [Capabilities]
      operationId: getApiContracts
      summary: Read API versions, compatibility and deprecation policy
      security: []
      description: Also at the unversioned /api/contracts, which stays available after a version sunsets. Optional X-Waveform-API-Version and X-Waveform-Protocol-Version request headers must match v1 and 1.
      responses:
        '200':
          description: Contract catalog and compatibility matrix
          content:
            application/json:
              schema:
                type: object
                required: [service, default_api_version, protocol_versions, contracts, compatibility, policy]
                properties:
                  service: { type: string, const: silicon-waveform }
                  default_api_version: { type: string, const: v1 }
                  protocol_versions: { type: array, items: { type: string } }
                  contracts: { type: array, items: { type: object } }
                  compatibility: { type: array, items: { type: object } }
                  policy: { type: object }
        '406': { description: Unsupported API or protocol version }
        '410': { description: The requested API version has sunset; use /api/contracts }

  /telemetry:
    post:
      tags: [Accounts]
      operationId: recordBrowserEvent
      summary: Record a diagnostics event (dropped when the account opted out)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event]
              properties:
                event: { type: string, enum: [speech_completed, speech_failed, settings_saved, page_view] }
                elapsed_ms: { type: integer, minimum: 0, maximum: 86400000, default: 0 }
      responses:
        '204': { description: Event handled }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports:
    post:
      tags: [Accounts]
      operationId: submitBugReport
      summary: Submit a bug report with an optional pull request
      description: Idempotent; ten reports per account per hour. Reports that contain tokens or secrets are refused.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message: { type: string, minLength: 1, maxLength: 60000 }
                pr: { type: [string, 'null'], format: uri }
                client_version: { type: string, maxLength: 100 }
      responses:
        '202': { description: Report saved and queued for delivery }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Idempotency key reused with different content }
        '429': { description: Hourly report limit reached }
        '503': { description: Report delivery is not configured }

  /webhooks/accounts:
    servers:
      - url: https://backend.waveform.teamofsilicons.com
    post:
      tags: [Webhooks]
      operationId: receiveAccountsWebhook
      summary: Silicon Accounts events about Waveform's members
      security: []
      description: |
        Signed by Silicon Accounts: `X-Accounts-Signature: v1=<hex HMAC-SHA256(whsec, "{X-Accounts-Timestamp}.{raw body}")>`,
        timestamp within 5 minutes. Deduplicated on `event_id`. Handles `account.id_changed`, `account.updated`,
        `silicon.custodian_changed`, `membership.signed_out` (every reason except `app_revoked` refuses tokens
        issued before the event and ends Waveform's Briefcase access), `membership.access_removed` (the same),
        `account.deleted` (deletes the account's Waveform data) and `ping`. Unknown types answer 200.
      parameters:
        - { in: header, name: X-Accounts-Timestamp, required: true, schema: { type: string } }
        - { in: header, name: X-Accounts-Signature, required: true, schema: { type: string } }
        - { in: header, name: X-Accounts-Event-Id, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, type, data]
              properties:
                event_id: { type: string }
                type: { type: string }
                occurred_at: { type: string, format: date-time }
                app_id: { type: [string, 'null'] }
                silicon: { type: [string, 'null'] }
                data: { type: object }
      responses:
        '200':
          description: Applied (or a duplicate of an event already applied)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  event_id: { type: string }
                  outcome: { type: string }
                  duplicate: { type: boolean }
        '400': { description: The signed body is not a Silicon Accounts event }
        '401': { description: 'Missing, stale or wrong signature' }
        '503': { description: No webhook secret is configured }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Silicon Accounts access token issued to app `waveform` (EdDSA JWT, `aud` = `waveform`,
        `iss` = the Silicon Accounts URL, at most 30 minutes). Verified locally against the published key set;
        sign-ins that ended (signed out, access removed, account deleted) are refused.
    proofAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Proof sap_…`: a Silicon Accounts User verification proof issued by another app for `receiving_app`
        `waveform`, verified with Silicon Accounts on every call. Needs the route's scope (`waveform.tts` or
        `waveform.stt`) and an issuing app allowed for that scope. Waveform acts as the proof's account and
        records the issuing app on the job.

  parameters:
    Account:
      name: account
      in: query
      required: false
      description: |
        Act on another account's data: `c:…`/`si:…` id or uuid. Allowed only for a Carbon selecting a Silicon
        it is the custodian of (or for selecting yourself). Never allowed for speech.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Scoped to the account and operation for at least 24 hours. Reusing a key with a different validated
        request during retention returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[!-~]+$'
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional attempt correlation UUID. Invalid values are replaced by Waveform. A successful idempotent
        replay returns the stored canonical operation UUID instead.
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [gemini, elevenlabs, openai, deepgram] }

  headers:
    RequestId:
      description: |
        Waveform request correlation ID. A successful speech replay uses the stored canonical operation UUID;
        replay-time errors use the current attempt UUID.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: True when stable completed-operation state was reused.
      schema: { type: boolean }
    CacheControl:
      description: Prevents intermediaries from retaining private data.
      schema: { type: string, const: no-store }

  responses:
    BadRequest:
      description: |
        Malformed headers, URL, language hint, or JSON input; or `speech_runs_as_yourself` when a speech
        route (`/tts`, `/stt`, `/stt/source-target`, `/audio/{request_id}`) is given `?account=`: speech
        always runs as the caller, and a custodian never speaks as a Silicon.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: |
        The credential is missing, malformed, expired, issued to another app or by another Accounts
        deployment, from an ended sign-in, or an invalid proof. `error.reason` says which; `error.hint` says
        what to do.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: |
        Authenticated but not allowed: not the Silicon's custodian, a proof without the route's scope or from
        an app that is not allowed, a route that takes no proofs, or no Briefcase access for the account.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SourceNotFound:
      description: Briefcase reports the STT source (or a replayed TTS file) as missing
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency key mismatch, or another request currently owns the key
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: Text, request body, source media, or generated audio exceeds a synchronous limit
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: Briefcase source media is not accepted by the STT contract
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Waveform admission control rejected the request
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadGateway:
      description: The selected TTS provider failed with fallback off, or every enabled provider failed
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: Silicon Accounts, Briefcase, PostgreSQL or another dependency is unavailable (`error.reason` names it)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    GatewayTimeout:
      description: The bounded synchronous operation exceeded its deadline
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error:
      description: Normalized Waveform error
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    AccountRef:
      type: object
      required: [uuid]
      properties:
        uuid: { type: string, description: Permanent Silicon Accounts uuid (case-sensitive), example: zQo }
        id: { type: [string, 'null'], description: Current public id, example: 'c:ada' }
    Account:
      type: object
      required: [uuid, id, kind]
      properties:
        uuid: { type: string, example: K1E }
        id: { type: [string, 'null'], example: 'si:scout' }
        kind: { type: string, enum: [carbon, silicon] }
        display_name: { type: [string, 'null'] }
        pfp_url: { type: [string, 'null'], format: uri }
        custodian:
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - { type: 'null' }
    Me:
      type: object
      required: [authenticated, app_id, account, via]
      properties:
        authenticated: { type: boolean, const: true }
        app_id: { type: string, const: waveform }
        account: { $ref: '#/components/schemas/Account' }
        via: { type: string, const: bearer }
        expires_at: { type: [string, 'null'], format: date-time }
    BriefcaseAccess:
      type: object
      required: [account, briefcase]
      properties:
        account: { $ref: '#/components/schemas/AccountRef' }
        briefcase:
          type: object
          required: [status, receiving_app, scopes]
          properties:
            status: { type: string, enum: [active, revoked, missing] }
            receiving_app: { type: string, const: briefcase }
            scopes: { type: array, items: { type: string } }
            proof_id: { type: [string, 'null'] }
            token_expires_at: { type: [string, 'null'], format: date-time }
            refresh_expires_at: { type: [string, 'null'], format: date-time }
            updated_at: { type: [string, 'null'], format: date-time }
            revoked_reason: { type: [string, 'null'], example: access_removed }
    TTSResult:
      type: object
      additionalProperties: false
      required: [request_id, file_url, temporary_url, audio_url, storage, media_type, provider, duration_ms]
      properties:
        voice_profile:
          oneOf:
            - $ref: '#/components/schemas/VoiceProfileRef'
            - { type: 'null' }
        request_id:
          type: string
          format: uuid
          description: Canonical operation UUID, preserved on completed replay.
        file_url:
          type: [string, 'null']
          format: uri
          description: Permanent Briefcase URL; null when Waveform holds the audio instead.
        temporary_url: { type: 'null', description: Always null; kept for older clients. }
        audio_url:
          type: [string, 'null']
          format: uri
          description: Waveform URL serving the MP3 while it is held (GET /audio/{request_id}); null when stored in Briefcase.
        storage:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [stored, held] }
            reason:
              type: string
              enum: [delegated_call, storage_not_authorized, briefcase_refused, briefcase_unavailable, briefcase_timeout, briefcase_contract_unavailable]
            message: { type: string }
            expires_at: { type: string, format: date-time }
        media_type: { type: string, const: audio/mpeg }
        provider:
          type: string
          enum: [gemini, elevenlabs, openai]
          description: Provider that completed synthesis
        duration_ms: { type: integer, format: int64, minimum: 0 }
    Job:
      type: object
      required: [id, operation, status, first_line, created_at]
      properties:
        voice_profile:
          oneOf:
            - $ref: '#/components/schemas/VoiceProfileRef'
            - { type: 'null' }
        id: { type: string, format: uuid }
        issuing_app: { type: [string, 'null'], description: App that called Waveform for the account with a proof }
        operation: { type: string, enum: [tts, stt] }
        status: { type: string, enum: [running, failed, completed] }
        first_line: { type: string }
        duration_ms: { type: [integer, 'null'], format: int64, minimum: 0 }
        provider: { type: [string, 'null'] }
        error_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    JobPage:
      type: object
      required: [account, items, next_cursor]
      properties:
        account: { $ref: '#/components/schemas/AccountRef' }
        items: { type: array, items: { $ref: '#/components/schemas/Job' } }
        next_cursor: { type: [string, 'null'] }
    Preferences:
      type: object
      required: [account, tts_order, stt_order, voice_profile, defaults]
      properties:
        account: { $ref: '#/components/schemas/AccountRef' }
        telemetry_enabled: { type: boolean, default: true }
        voice_profile: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
        tts_order: { type: array, items: { type: string, enum: [gemini, elevenlabs, openai] } }
        stt_order: { type: array, items: { type: string, enum: [gemini, openai, deepgram] } }
        defaults:
          type: object
          required: [tts_order, stt_order, voice_profile]
          properties:
            voice_profile: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
            tts_order: { type: array, items: { type: string } }
            stt_order: { type: array, items: { type: string } }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                invalid_request, speech_runs_as_yourself, unauthenticated, forbidden, not_custodian,
                account_not_found, briefcase_folder_not_found, payload_too_large,
                unsupported_media_type, source_not_found, storage_authorization_required, idempotency_key_reused,
                request_in_progress, provider_failed, providers_exhausted, dependency_contract_unavailable,
                dependency_unavailable, dependency_timeout, too_many_requests, request_timeout, not_ready,
                not_found, route_retired, method_not_allowed, internal_error, unsupported_api_version,
                api_version_mismatch, unsupported_protocol_version, api_version_sunset, and route-specific codes.
            message: { type: string, minLength: 1, description: Exactly what failed and why }
            hint: { type: string, description: What to do next }
            reason:
              type: string
              description: |
                Exact authentication reason (missing_credentials, malformed_authorization, retired_credentials,
                invalid_token, token_expired, wrong_audience, wrong_issuer, unknown_signing_key, sign_in_ended,
                account_deleted, token_inactive, invalid_proof, proof_without_account, proof_scope_missing,
                proof_issuer_not_allowed, proof_not_accepted), the dependency that failed, or an allowlisted
                provider reason.
            provider: { type: string, enum: [gemini, elevenlabs, openai, deepgram] }
            provider_status: { type: integer, minimum: 100, maximum: 599 }
            request_id: { type: string, format: uuid }
    VoiceProfileRef:
      type: object
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
    VoiceProfile:
      type: object
      required: [id, name, description, revision, auditioned, gemini_voice, openai_voice, elevenlabs]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        name: { type: string }
        description: { type: string }
        revision: { type: integer, minimum: 1 }
        auditioned: { type: boolean, description: Whether a listening review has confirmed the cross-provider mapping }
        gemini_voice: { type: string }
        openai_voice: { type: string, enum: [alloy, ash, coral, echo, fable, onyx, nova, sage, shimmer] }
        elevenlabs:
          type: object
          required: [voice_id, model_id, voice_settings]
          properties:
            voice_id: { type: string }
            model_id: { type: string, const: eleven_multilingual_v2 }
            voice_settings:
              type: object
              required: [stability, similarity_boost, style, use_speaker_boost, speed]
              properties:
                stability: { type: number, minimum: 0, maximum: 1 }
                similarity_boost: { type: number, minimum: 0, maximum: 1 }
                style: { type: number, minimum: 0, maximum: 1 }
                use_speaker_boost: { type: boolean }
                speed: { type: number, minimum: 0.7, maximum: 1.2 }

    ProviderApiKey:
      type: string
      minLength: 1
      maxLength: 16384
      pattern: '^[!-~]+$'
      writeOnly: true
      description: Request-only credential. Overrides saved and deployment keys for this provider and is never persisted or returned.
    TTSProviderKeys:
      type: object
      additionalProperties: false
      properties:
        gemini: { $ref: '#/components/schemas/ProviderApiKey' }
        elevenlabs: { $ref: '#/components/schemas/ProviderApiKey' }
        openai: { $ref: '#/components/schemas/ProviderApiKey' }
    STTProviderKeys:
      type: object
      additionalProperties: false
      properties:
        gemini: { $ref: '#/components/schemas/ProviderApiKey' }
        openai: { $ref: '#/components/schemas/ProviderApiKey' }
        deepgram: { $ref: '#/components/schemas/ProviderApiKey' }
    TTSProviderOptions:
      type: object
      additionalProperties: false
      description: Nonempty controls must belong to the first resolved provider and require auto_fallback false. Omitted values inherit voice-profile and server settings.
      properties:
        gemini: { $ref: '#/components/schemas/GeminiTTSOptions' }
        elevenlabs: { $ref: '#/components/schemas/ElevenLabsTTSOptions' }
        openai: { $ref: '#/components/schemas/OpenAITTSOptions' }
    GeminiTTSOptions:
      type: object
      additionalProperties: false
      description: Direction fields become labeled prompt sections before the transcript. Total instructions at most 16384 characters.
      properties:
        voice: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z]+$' }
        scene: { type: string, minLength: 1, maxLength: 4096 }
        audio_profile: { type: string, minLength: 1, maxLength: 4096 }
        director_notes: { type: string, minLength: 1, maxLength: 4096 }
        sample_context: { type: string, minLength: 1, maxLength: 4096 }
    ElevenLabsTTSOptions:
      type: object
      additionalProperties: false
      properties:
        voice_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
        model_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$', description: Provider validates model availability for the selected API key }
        stability: { type: number, minimum: 0, maximum: 1 }
        similarity_boost: { type: number, minimum: 0, maximum: 1 }
        style: { type: number, minimum: 0, maximum: 1 }
        speed: { type: number, minimum: 0.7, maximum: 1.2 }
        use_speaker_boost: { type: boolean }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        previous_text: { type: string, minLength: 1, maxLength: 4096 }
        next_text: { type: string, minLength: 1, maxLength: 4096 }
        apply_text_normalization: { type: string, enum: [auto, 'on', 'off'] }
    OpenAITTSOptions:
      type: object
      additionalProperties: false
      properties:
        voice: { type: string, description: Built-in voice supported by the selected model }
        model: { type: string, enum: [tts-1, tts-1-hd, gpt-4o-mini-tts] }
        instructions: { type: string, minLength: 1, maxLength: 4096, description: Requires model gpt-4o-mini-tts explicitly }
        speed: { type: number, minimum: 0.25, maximum: 4 }

    TTSRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        auto_fallback:
          type: boolean
          default: false
          description: Try the remaining provider order only when true. Nonempty provider_options require false.
        provider_options:
          $ref: '#/components/schemas/TTSProviderOptions'
        provider_keys:
          $ref: '#/components/schemas/TTSProviderKeys'
        voice_profile:
          type: [string, 'null']
          pattern: '^[a-z0-9-]{1,64}$'
          description: Optional profile ID from voice-profiles. Omitted/null uses the account default. Applies to all fallback providers and never changes the saved default.
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: Non-whitespace text. The limit counts Unicode scalar values.
        lang:
          type: string
          minLength: 2
          maxLength: 64
          description: Optional canonicalizable BCP 47 hint; passed only to Gemini TTS.
        provider_order:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Preferred provider prefix; only its first resolved provider runs unless auto_fallback is true.
          items:
            type: string
            enum: [gemini, elevenlabs, openai]

    STTRequest:
      type: object
      additionalProperties: false
      required: [file_url]
      properties:
        provider_keys:
          $ref: '#/components/schemas/STTProviderKeys'
        file_url:
          type: string
          format: uri
          pattern: '^https?://'
          description: |
            Permanent Briefcase URL of a file in the account's own Briefcase drive
            (`{origin}/{owner uuid}/{path}`; permanent URLs issued before accounts still resolve), at the
            configured Briefcase origin. HTTPS; plain http only for a loopback Briefcase in development.
        language:
          type: string
          minLength: 2
          maxLength: 64
          description: Optional canonicalizable BCP 47 transcription hint.
        provider_order:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Preferred provider prefix; omitted providers follow the account order.
          items:
            type: string
            enum: [gemini, openai, deepgram]

    STTResult:
      type: object
      additionalProperties: false
      required: [request_id, transcript, detected_language, provider, duration_ms]
      properties:
        request_id:
          type: string
          format: uuid
          description: Canonical operation UUID, preserved on completed replay.
        transcript: { type: string }
        detected_language: { type: [string, 'null'] }
        provider:
          type: string
          enum: [gemini, openai, deepgram]
          description: Provider that completed transcription
        duration_ms: { type: [integer, 'null'], format: int64, minimum: 0 }

    PreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        telemetry_enabled: { type: boolean, default: true }
        voice_profile: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
        tts_order: { type: [array, 'null'], items: { type: string, enum: [gemini, elevenlabs, openai] } }
        stt_order: { type: [array, 'null'], items: { type: string, enum: [gemini, openai, deepgram] } }
    ProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { type: string, minLength: 1, maxLength: 16384 }
    ProviderKeyInfo:
      type: object
      required: [provider, configured, updated_at]
      properties:
        provider: { type: string }
        configured: { type: boolean, const: true }
        updated_at: { type: string, format: date-time }
    Capabilities:
      type: object
      additionalProperties: false
      required: [tts, stt, byok]
      properties:
        byok:
          type: object
          required: [saved, per_request, precedence]
          properties:
            saved: { type: boolean, const: true }
            per_request: { type: boolean, const: true }
            precedence: { type: array, items: { type: string }, example: [request, saved, shared] }
        tts:
          type: object
          additionalProperties: false
          required: [output_format, languages, auto_fallback_default, provider_options]
          properties:
            auto_fallback_default: { type: boolean, const: false }
            provider_options:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            output_format: { type: string, const: mp3 }
            languages:
              type: array
              minItems: 78
              maxItems: 78
              uniqueItems: true
              items:
                type: string
                enum:
                  - af
                  - am
                  - ar
                  - az
                  - be
                  - bg
                  - bn
                  - ca
                  - ceb
                  - cmn
                  - cs
                  - da
                  - de
                  - el
                  - en
                  - es
                  - et
                  - eu
                  - fa
                  - fi
                  - fil
                  - fr
                  - gl
                  - gu
                  - he
                  - hi
                  - hr
                  - ht
                  - hu
                  - hy
                  - id
                  - is
                  - it
                  - ja
                  - jv
                  - ka
                  - kn
                  - ko
                  - kok
                  - la
                  - lb
                  - lo
                  - lt
                  - lv
                  - mai
                  - mg
                  - mk
                  - ml
                  - mn
                  - mr
                  - ms
                  - my
                  - nb
                  - ne
                  - nl
                  - nn
                  - or
                  - pa
                  - pl
                  - ps
                  - pt
                  - ro
                  - ru
                  - sd
                  - si
                  - sk
                  - sl
                  - sq
                  - sr
                  - sv
                  - sw
                  - ta
                  - te
                  - th
                  - tr
                  - uk
                  - ur
                  - vi
              description: Best-effort BCP 47 language hints accepted by Waveform.
        stt:
          type: object
          additionalProperties: false
          required: [languages, accepted_media_types]
          properties:
            languages:
              type: array
              minItems: 10
              maxItems: 10
              uniqueItems: true
              items:
                type: string
                enum: [de, en, es, fr, hi, it, ja, nl, pt, ru]
              description: Best-effort BCP 47 language hints accepted by Waveform.
            accepted_media_types:
              type: array
              minItems: 11
              maxItems: 11
              uniqueItems: true
              items:
                type: string
                enum:
                  - audio/mpeg
                  - audio/wav
                  - audio/flac
                  - audio/ogg
                  - audio/webm
                  - audio/mp4
                  - audio/aac
                  - audio/m4a
                  - video/mp4
                  - video/mpeg
                  - video/webm

