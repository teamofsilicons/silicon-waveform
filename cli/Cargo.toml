[package]
name="waveform-cli"
version="0.6.0"
edition="2024"
rust-version="1.98"
description="Command-line client for Silicon Waveform speech services, signed in with Silicon Accounts"
repository="https://github.com/teamofsilicons/silicon-waveform"
license-file="LICENSE"
readme="README.md"
keywords=["speech", "tts", "stt", "silicon", "waveform"]
categories=["command-line-utilities", "multimedia::audio"]
[[bin]]
name="waveform"
path="src/main.rs"
[dependencies]
clap={version="4.5",features=["derive","env"]}
tokio={version="1.53",features=["macros","rt-multi-thread","time"]}
serde={version="1.0",features=["derive"]}
serde_json="1.0"
rpassword="7.5.4"
silicon-waveform-client={version="0.6.0",path="../client"}
uuid={version="1",features=["v4"]}
sha2="0.10"
time={version="0.3.41",features=["formatting"]}
url="2.5"
[dev-dependencies]
wiremock="0.6"
