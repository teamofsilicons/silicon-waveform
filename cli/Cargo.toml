[package]
name="waveform-cli"
version="0.1.1"
edition="2024"
rust-version="1.98"
description="Command-line client for Silicon Waveform speech services"
repository="https://github.com/teamofsilicons/silicon-waveform"
license-file="LICENSE"
readme="README.md"
[[bin]]
name="waveform"
path="src/main.rs"
[dependencies]
clap={version="4.5",features=["derive","env"]}
tokio={version="1.53",features=["macros","rt-multi-thread"]}
serde={version="1.0",features=["derive"]}
serde_json="1.0"
secrecy="0.10"
rpassword="7.5.4"
silicon-iam-client="1.3.0"
silicon-waveform-client={version="0.1.0",path="../client"}
uuid={version="1",features=["v4"]}
sha2="0.10"
[dev-dependencies]
wiremock="0.6"
