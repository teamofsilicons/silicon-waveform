name: Build native backend bundle
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Optional successful CLI release run to verify on native catalog runners
        required: false
        default: ''
      source_revision:
        description: Exact CLI candidate source commit
        required: false
        default: ''
permissions:
  contents: read
jobs:
  backend:
    if: inputs.candidate_run == ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-backend-musl
      - name: Install build and audio dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake ninja-build ffmpeg
      - name: Build static backend
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --bin waveform-api --target aarch64-unknown-linux-musl
      - name: Package native backend and audio runtime
        run: python3 scripts/package-backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-backend-linux-aarch64
          path: dist/backend/*
          if-no-files-found: error
  frontend:
    if: inputs.candidate_run == ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM64 frontend image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag waveform-frontend:release web
      - name: Verify image and save deployment artifact
        run: |
          mkdir -p dist/frontend
          docker save waveform-frontend:release | gzip > dist/frontend/waveform-frontend-linux-aarch64.tar.gz
          sha256sum dist/frontend/waveform-frontend-linux-aarch64.tar.gz > dist/frontend/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-frontend-linux-aarch64
          path: dist/frontend/*
          if-no-files-found: error
  catalog-proof:
    if: inputs.candidate_run != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux-aarch64 }
          - { runner: macos-15-intel, target: macos-x86_64 }
          - { runner: macos-15, target: macos-aarch64 }
          - { runner: windows-2025, target: windows-x86_64 }
          - { runner: windows-11-arm, target: windows-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify candidate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate.json
          python - <<'PYPROOF'
          import json, os
          r=json.load(open('candidate.json'))
          assert r['head_sha']==os.environ['SOURCE_REVISION'] and r['conclusion']=='success'
          assert r['path']=='.github/workflows/release.yml'
          PYPROOF
      - uses: actions/download-artifact@v4
        with:
          name: waveform-silicon-apps-release
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - name: Execute exact packaged bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          archive=$(find candidate -name "waveform-*-$TARGET.tar.gz")
          python scripts/native_catalog_proof.py --app waveform --archive "$archive" --target "$TARGET" --source-revision "$SOURCE_REVISION" --candidate-run "$CANDIDATE_RUN" --output "proof/waveform-$TARGET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-catalog-proof-${{ matrix.target }}
          path: proof/
          if-no-files-found: error
