name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: silicon_waveform_test
          POSTGRES_USER: silicon_waveform
          POSTGRES_PASSWORD: silicon_waveform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silicon_waveform -d silicon_waveform_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WAVEFORM_TEST_DATABASE_URL: postgres://silicon_waveform:silicon_waveform@127.0.0.1:5432/silicon_waveform_test
    steps:
      - uses: actions/checkout@v4
      - name: Install audio test runtime
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check bundled documentation
        run: python3 scripts/sync-cli-docs.py --check
      - name: Check the packaging, deployment and development tooling
        run: |
          python3 scripts/test_package_apps.py
          python3 scripts/test_dev_tools.py
          python3 deploy/native/test_upgrade.py
          python3 deploy/native/test_accounts_cutover.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run PostgreSQL transaction tests
        run: |
          cargo test --lib -- --ignored --test-threads=1
          cargo test --test postgres_idempotency -- --ignored --test-threads=1
      - name: Check Rust client and CLI
        run: |
          cargo fmt --manifest-path client/Cargo.toml -- --check
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo clippy --manifest-path client/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path client/Cargo.toml
          cargo test --manifest-path cli/Cargo.toml
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  silicon-apps-package:
    # The release workflow packs every target; this packs the static Linux CLI on each change so a broken manifest,
    # packer or discovery command fails here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and the static Linux target
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: silicon-apps-package
      - name: Build the static CLI
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --manifest-path cli/Cargo.toml --target x86_64-unknown-linux-musl
      - name: Install the Silicon Apps packer
        run: cargo install --locked silicon-apps-cli --version 0.2.0
      - name: Package and validate for linux-x86_64
        env:
          PACKAGE_DISCOVERY: require
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("cli/Cargo.toml", "rb"))["package"]["version"])')
          scripts/package-apps.sh "$version" linux-x86_64 cli/target/x86_64-unknown-linux-musl/debug/waveform

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag si:silicon-waveform .
      - name: Verify API image runs
        run: docker run --rm si:silicon-waveform --help
      - name: Build frontend image
        run: docker build --tag si:silicon-waveform-frontend web

  web-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and check frontend
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          NEXT_OUTPUT=standalone pnpm build
      - name: Build and check docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-frontend
          path: web/.next/standalone/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-docs
          path: docs-site/dist/
          if-no-files-found: error
