name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: silicon_waveform_test
          POSTGRES_USER: silicon_waveform
          POSTGRES_PASSWORD: silicon_waveform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silicon_waveform -d silicon_waveform_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WAVEFORM_TEST_DATABASE_URL: postgres://silicon_waveform:silicon_waveform@127.0.0.1:5432/silicon_waveform_test
    steps:
      - uses: actions/checkout@v4
      - name: Install audio test runtime
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check bundled documentation
        run: python3 scripts/sync-cli-docs.py --check
      - name: Check Honeycomb build manifests
        run: python3 scripts/sync-honeycomb.py --check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run PostgreSQL transaction tests
        run: |
          cargo build --manifest-path cli/Cargo.toml --locked
          cargo test --lib -- --ignored --test-threads=1
          cargo test --test postgres_idempotency -- --ignored --test-threads=1
      - name: Check Rust client and CLI
        run: |
          cargo fmt --manifest-path client/Cargo.toml -- --check
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo clippy --manifest-path client/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path client/Cargo.toml
          cargo test --manifest-path cli/Cargo.toml
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag si:silicon-waveform .
      - name: Verify API image manifest
        run: docker run --rm --entrypoint cat si:silicon-waveform /usr/share/waveform/honeycomb.yaml | cmp honeycomb.yaml -
      - name: Build frontend image
        run: docker build --tag si:silicon-waveform-frontend frontend
      - name: Verify frontend image manifest
        run: docker run --rm --entrypoint cat si:silicon-waveform-frontend /usr/share/waveform/honeycomb.yaml | cmp honeycomb.yaml -

  web-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/sync-honeycomb.py --check
      - name: Build and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          cmp ../honeycomb.yaml dist/honeycomb.yaml
      - name: Build and check docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-frontend
          path: frontend/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-docs
          path: docs-site/dist/
          if-no-files-found: error
