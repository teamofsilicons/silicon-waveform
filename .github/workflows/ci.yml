name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: silicon_waveform_test
          POSTGRES_USER: silicon_waveform
          POSTGRES_PASSWORD: silicon_waveform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silicon_waveform -d silicon_waveform_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WAVEFORM_TEST_DATABASE_URL: postgres://silicon_waveform:silicon_waveform@127.0.0.1:5432/silicon_waveform_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run PostgreSQL transaction tests
        run: cargo test --test postgres_idempotency -- --ignored --test-threads=1
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag silicon-waveform:test .
