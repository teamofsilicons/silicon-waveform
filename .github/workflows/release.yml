name: Build validated Honeycomb release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            triple: x86_64-unknown-linux-musl
            binary: waveform
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            triple: aarch64-unknown-linux-musl
            binary: waveform
          - runner: windows-2025
            target: windows-x86_64
            triple: x86_64-pc-windows-msvc
            binary: waveform.exe
          - runner: windows-11-arm
            target: windows-aarch64
            triple: aarch64-pc-windows-msvc
            binary: waveform.exe
          - runner: macos-15-intel
            target: macos-x86_64
            triple: x86_64-apple-darwin
            binary: waveform
          - runner: macos-15
            target: macos-aarch64
            triple: aarch64-apple-darwin
            binary: waveform
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.triple }}
      - name: Install static Linux toolchain
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: python ../scripts/sync-cli-docs.py --check
      - run: python ../scripts/sync-honeycomb.py --check
      - run: cargo test --locked -p waveform-cli --target ${{ matrix.triple }}
      - run: cargo build --release --locked -p waveform-cli --target ${{ matrix.triple }}
      - run: ./target/${{ matrix.triple }}/release/${{ matrix.binary }} --version
      - name: Reject dynamic Linux linkage
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          python - <<'PY'
          import os, pathlib, struct
          executable = pathlib.Path('target') / os.environ['TRIPLE'] / 'release/waveform'
          data = executable.read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01'
          offset = struct.unpack_from('<Q', data, 32)[0]
          size, count = struct.unpack_from('<HH', data, 54)
          assert all(struct.unpack_from('<I', data, offset + size * index)[0] != 3 for index in range(count)), 'Linux executable requires a dynamic loader'
          assert b'GLIBC_2.' not in data, 'Linux executable has a GLIBC requirement'
          PY
      - name: Stage native artifact with its manifest
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TRIPLE: ${{ matrix.triple }}
          BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          stage = pathlib.Path('../build-artifacts') / os.environ['TARGET']
          stage.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(pathlib.Path('target') / os.environ['TRIPLE'] / 'release' / os.environ['BINARY'], stage / os.environ['BINARY'])
          shutil.copyfile('../honeycomb.yaml', stage / 'honeycomb.yaml')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build-artifacts/${{ matrix.target }}/
          if-no-files-found: error

  package:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*64'
          path: release-binaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Install the pinned Honeycomb packager
        run: cargo install --locked --git https://github.com/teamofsilicons/silicon-honeycomb --rev 20f4a1ec5cef28da439cbf91226823811e07b73a silicon-honeycomb-cli
      - name: Check release tag against the CLI version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('cli/Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match the CLI version'
          PY
      - run: python scripts/package-release.py --binaries-dir release-binaries
      - uses: actions/upload-artifact@v4
        with:
          name: waveform-honeycomb-release
          path: dist/*
          if-no-files-found: error

# This workflow produces reviewable artifacts; it does not publish a release.
