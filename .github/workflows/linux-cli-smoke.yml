name: Verify Linux CLI on Amazon Linux 2023
# Runs the exact Silicon Apps archives a release run produced on the oldest Linux the Silicon fleet uses, in a clean,
# read-only container: the three discovery commands Silicon Apps requires, signed out.
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful "Build Silicon Apps release" workflow run
        required: true
        type: string
      source_revision:
        description: Expected full source revision of the artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-baseline:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify artifact source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_RUN: ${{ inputs.release_run }}
          SOURCE: ${{ inputs.source_revision }}
        run: |
          test "$(gh api "repos/$REPO/actions/runs/$RELEASE_RUN" --jq .head_sha)" = "$SOURCE"
      - uses: actions/download-artifact@v4
        with:
          name: waveform-apps-${{ matrix.target }}
          path: smoke
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
      - name: Check and extract the archive
        working-directory: smoke
        run: |
          sha256sum --check --strict ./*.tar.gz.sha256
          mkdir package
          tar -xzf ./*.tar.gz -C package
          cat package/apps.yaml
      - name: Run the discovery commands on the production Linux baseline
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw -e HOME=/tmp -e SILICON_HOME=/tmp \
            -v "$PWD/smoke/package/bin/waveform:/opt/waveform:ro" public.ecr.aws/amazonlinux/amazonlinux:2023 \
            sh -c 'set -e; ldd --version | head -1; /opt/waveform --version; /opt/waveform --help >/tmp/help;
                   test -s /tmp/help; /opt/waveform accounts --json; /opt/waveform login status --json'
